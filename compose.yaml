services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: timeclock
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: timeclock
    ports:
      - "127.0.0.1:5548:5432"
    volumes:
      - timeclock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeclock"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  timeclock_data:
